site_name: Red Teaming and OT Security Resource Hub
site_description: >-
  Curated resources for learning about red teaming, OT security, physical security crossover, and ethical security research.
theme:
  name: material
  favicon: imgs/github-favicon.svg
  logo: imgs/project-logo.svg
  font:
    text: Open Sans
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.expand
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
repo_url: https://github.com/mzbreach/resources-and-tools
repo_name: resources-and-tools
edit_uri: tree/main/docs
nav:
  - Home: README.md
  - Communities: communities.md
  - Researchers: researchers.md
  - Tools: tools.md
  - Writeups and Case Studies: writeups.md
  - Events and Conferences: conferences.md
  - Rabbit Holes: rabbit-holes.md
  - Obscure Resources: obscure-resources.md
  - Starter Projects: starter-projects.md
  - RFID Research: rfid.md
plugins:
  - search
  #- git-revision-date-localized
extra_css:
  - 'stylesheets/color.css'
extra_templates:
  - 'metadata.json'
markdown_extensions:
  - toc:
      permalink: "#"
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      auto_title: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
